# Base H2 en memoria: se recrea en cada arranque.
spring.datasource.url=jdbc:h2:mem:marketplace;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Necesario para que data.sql corra DESPUES de que Hibernate cree las tablas.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Consola web: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:marketplace)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
